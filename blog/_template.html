<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — Alexis Christoforides</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#ffffe1" />
  <link rel="canonical" href="{{CANONICAL}}" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:site_name" content="Alexis Christoforides" />
  <meta property="og:image" content="https://thenull.net/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Alexis Christoforides — Software Engineer &amp; Consultant, Boston MA" />
  <meta property="article:published_time" content="{{DATE_ISO}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="https://thenull.net/og-image.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
    {
      "@type": "BlogPosting",
      "@id": "{{CANONICAL}}#post",
      "headline": "{{TITLE_JSON}}",
      "datePublished": "{{DATE_ISO}}",
      "url": "{{CANONICAL}}",
      "mainEntityOfPage": "{{CANONICAL}}",
      "description": "{{DESCRIPTION_JSON}}",
      "image": "https://thenull.net/og-image.png",
      "inLanguage": "en-US",
      "isPartOf": { "@id": "https://thenull.net/blog/#blog" },
      "author": {
        "@type": "Person",
        "@id": "https://thenull.net/#person",
        "name": "Alexis Christoforides",
        "url": "https://thenull.net/"
      }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://thenull.net/" },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://thenull.net/blog/" },
        { "@type": "ListItem", "position": 3, "name": "{{TITLE_JSON}}" }
      ]
    }
    ]
  }
  </script>

  <link rel="preload" href="/assets/fonts/dm-serif-display-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/blog/blog.css" />
{{KATEX_CSS}}
</head>
<body>

  <nav id="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/"><span class="nav-logo-full">Alexis Christoforides</span><span class="nav-logo-short" aria-hidden="true">AC</span></a>
      <ul class="nav-links">
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero blog-hero">
    <div class="container">
      <p class="blog-back"><a href="/blog/">&larr; Blog</a></p>
      <h1 class="hero-name">{{TITLE}}</h1>
      <p class="hero-role"><time datetime="{{DATE_ISO}}">{{DATE}}</time></p>
      <hr class="hero-rule" />
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container">
        <article class="post-body">
{{BODY}}
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Alexis Christoforides · Boston, MA · <span id="year"></span></p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('nav-scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>
</body>
</html>
