<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <script>
    // Posts are now static pages at /blog/<slug>; redirect old shared links.
    var slug = new URLSearchParams(location.search).get('post');
    location.replace(slug ? '/blog/' + encodeURIComponent(slug) : '/blog/');
  </script>
</head>
<body>
  <p><a href="/blog/">Redirecting to the blog…</a></p>
</body>
</html>
